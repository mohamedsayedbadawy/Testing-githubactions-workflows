name: workflow_commands 
on:
  workflow_dispatch
jobs:
  warning-job:
    runs-on: ubuntu-latest
    steps:

      - name: set api key
        run: |
               echo "::error::take care there is an warning"
               echo " api_key=12345" >> $GITHUB_ENV
      - name: print api key
        run: echo "::add-mask::$api_key"
      - name: print
        run: echo " the api key is $api_key"
